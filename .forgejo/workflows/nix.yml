# The Forgejo variant: its runners carry the label `native`, and have nix
# installed already.

# This file comes from the tools repository, https://github.com/larry0x/tools,
# and `just sync-tools` copies it in. `nix flake check` fails when the copy
# differs from the version flake.lock pins, so change it there, not in the
# copy.

name: Nix

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The workflow runs on every change: `nix flake check` checks, among other
# things, that the files taken from the tools repository are unchanged, and
# any of them can change.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

# Each step runs one just recipe and nothing else, so CI checks exactly what
# `just ci` checks before every commit. A recipe does nothing in a repository
# without its language.
jobs:
  fmt:
    name: Format
    runs-on: native
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: just fmt-check-nix
        run: nix develop --command just fmt-check-nix

  lint-test:
    name: Lint + Test
    runs-on: native
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: just lint-nix
        run: nix develop --command just lint-nix

      - name: just test-nix
        run: nix develop --command just test-nix
