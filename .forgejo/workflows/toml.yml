# The Forgejo variant: its runners carry the label `native`, and have nix
# installed already.

# This file comes from the tools repository, https://github.com/larry0x/tools,
# and `just sync-tools` copies it in. `nix flake check` fails when the copy
# differs from the version flake.lock pins, so change it there, not in the
# copy.

name: TOML

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The workflow runs when a file of its language changes, or a file that
# changes what the recipes do: the flake, which pins the tools; the justfile;
# and .gitignore, which decides the files the recipes see.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "**.toml"
      - ".forgejo/workflows/toml.yml"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "base.just"
      - ".gitignore"
  pull_request:
    branches:
      - "*"
    paths:
      - "**.toml"
      - ".forgejo/workflows/toml.yml"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "base.just"
      - ".gitignore"

permissions:
  contents: read

# Each step runs one just recipe and nothing else, so CI checks exactly what
# `just ci` checks before every commit. A recipe does nothing in a repository
# without its language.
jobs:
  fmt:
    name: Format
    runs-on: native
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: just fmt-check-toml
        run: nix develop --command just fmt-check-toml

  lint:
    name: Lint
    runs-on: native
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: just lint-toml
        run: nix develop --command just lint-toml
