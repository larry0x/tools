# This file comes from the tools repository, https://github.com/larry0x/tools,
# and `just sync-tools` copies it in. `nix flake check` fails when the copy
# differs from the version flake.lock pins, so change it there, not in the
# copy.

name: Markdown

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The workflow runs when a file of its language changes, or a file that
# changes what the recipes do: the flake, which pins the tools; the justfile;
# and .gitignore, which decides the files the recipes see.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "**.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/markdown.yml"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "base.just"
      - ".gitignore"
  pull_request:
    branches:
      - "*"
    paths:
      - "**.md"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/markdown.yml"
      - "flake.nix"
      - "flake.lock"
      - "justfile"
      - "base.just"
      - ".gitignore"

permissions:
  contents: read

# Each step runs one just recipe and nothing else, so CI checks exactly what
# `just ci` checks before every commit. A recipe does nothing in a repository
# without its language.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: just lint-markdown
        run: nix develop --command just lint-markdown
