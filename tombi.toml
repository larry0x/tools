# https://tombi-toml.github.io/tombi/docs/configuration

# TOML 1.0 has no multi-line inline tables, so the formatter leaves an
# inline table on one line, however long.
toml-version = "v1.0.0"

# The formatter keeps comments, string quotes, and date-time delimiters as
# written. There is no line width: with one, the formatter would split the
# arrays inside a long inline table, such as a dependency's features. So an
# array is split over lines only by hand, and a trailing comma keeps it so.
[format.rules]
comment-style                   = "preserve"
date-time-delimiter             = "preserve"
group-blank-lines-limit         = 1
key-value-equals-sign-alignment = true
string-quote-style              = "preserve"

# Tombi sorts keys only where a schema asks it to. The one below asks it to in
# every table but the root, so the keys of each table sort alphabetically,
# and so do its sub-tables, while the top-level tables keep the order they
# are written in. It applies to every file, in place of the JSON Schema
# Store, whose catalog is off, so the linter checks syntax only and needs no
# network. An array's order can carry meaning, such as ruff's isort
# section-order, so arrays are left as written.
[schema.catalog]
paths = []

[[schemas]]
include = ["**/*.toml"]
path    = "tombi-key-order.json"
